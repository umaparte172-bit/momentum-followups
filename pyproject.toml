[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-followups"
version = "0.15.1"
requires-python = ">=3.11"
dependencies = ["playwright>=1.51,<2", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "tzdata>=2025.1"]

[project.scripts]
momentum-followups = "momentum.server:main"

[tool.setuptools.packages.find]
include = ["momentum*"]

[tool.setuptools.package-data]
momentum = ["*.html", "*.json", "*.svg", "assets/*", "assets/fonts/*", "extension/*", "extension/icons/*"]

